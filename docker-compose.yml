services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: scouting
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scouting"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:localpassword@db:5432/scouting
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
